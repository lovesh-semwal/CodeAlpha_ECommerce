<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CodeAlpha Store</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar">
            <h2>CodeAlpha Store</h2>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="cart.html">Cart 🛒</a>
                <a href="login.html">Login</a>
            </div>
        </nav>
    </header>

    <!-- Login Section -->
    <main>
        <section class="auth-section">

            <div class="auth-card">

                <h1>Welcome Back</h1>

                <form id="login-form">

                    <input
                        type="email"
                        id="email"
                        placeholder="Email"
                        required
                    >

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required
                    >

                    <button type="submit">
                        Login
                    </button>

                </form>

                <p id="message"></p>

                <p>
                    Don't have an account?
                    <a href="register.html">Register</a>
                </p>

            </div>

        </section>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
